[project]
name = "jira-analize"
version = "0.1.0"
description = "PyQt application for visualizing Apache Jira issue statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4.0",
    "PyQt6>=6.7,<7.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
